<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBJ - محمد بشار باسل جمعة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
        }
        .btn-email {
            background-color: #ea4335;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">MBJ</div>
        <div class="subtitle">محمد بشار باسل جمعة</div>

        <a href="https://wa.me/963934532008" class="btn btn-whatsapp" target="_blank">
            تواصل عبر واتساب
        </a>

        <a href="mailto:jumaab862@gmail.com" class="btn btn-email">
            تواصل عبر الإيميل
        </a>
    </div>

</body>
</html>
